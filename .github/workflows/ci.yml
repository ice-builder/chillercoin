name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boundary:
    name: Public push gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Scan public tree
        run: node scripts/public-push-audit.mjs

  dashboard:
    name: Dashboard syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Check app.js
        run: node --check chiller-dashboard/app.js

  bankrun:
    name: Vault bankrun
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chiller-vault
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chiller-vault/package-lock.json
      - name: Require BPF fixture
        run: test -f tests/fixtures/chiller_vault.so
      - name: Stage BPF where bankrun loads it
        run: |
          mkdir -p target/deploy
          cp tests/fixtures/chiller_vault.so target/deploy/chiller_vault.so
      - name: Install deps
        run: npm ci
      - name: Bankrun attestation suite
        run: npm test
